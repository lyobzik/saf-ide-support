org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.stdlib.default.dependency=false

# Where the IntelliJ platform comes from: `local` (an installed IDE) or `maven`
# (IntelliJ IDEA Community from the repositories). CI runs with -PideSource=maven.
ideSource=local

# Path to a local IntelliJ-platform IDE used to compile and run against.
# Read only when ideSource=local; override with -PlocalIdePath=... .
localIdePath=/Applications/GIGA IDE CE 2025.1.app

# Platform version used when ideSource=maven.
platformVersion=2025.1

pluginSinceBuild=251

# Верхняя версия IDE для verifyPlugin. Нижнюю берёт platformVersion; обе
# перечислены явно, чтобы стоимость проверки в CI не зависела от того, сколько
# мажорных версий вышло у JetBrains.
verifierLatestVersion=2026.2
