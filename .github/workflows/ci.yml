# CI зеркала на GitHub — второй хостинг, намеренно лёгкий.
#
# Что здесь проверяется: словарь ключевых слов, версии манифестов, схемы общих
# артефактов, алгоритм публикации и юнит-сторона расширения VS Code.
#
# Чего здесь НЕТ и почему:
#   * сторона IDEA (тесты плагина и verifyPlugin) — каждому такому шагу нужен
#     дистрибутив платформы, полный пайплайн живёт в GitLab;
#   * снимок `rules.json` (`contract:rules`) — его проверка компилирует
#     исходники плагина и тянет ту же платформу, «лёгким» workflow с ним не был
#     бы;
#   * интеграционный тест VS Code — ему нужны системные библиотеки Electron, а
#     `ubuntu-latest` и Debian-контейнер GitLab различаются и правами, и
#     именами пакетов; одна проверенная площадка лучше двух похожих;
#   * упаковка и релиз — владелец релиза один, и это GitLab. Иначе один
#     зеркалированный тег запустил бы два независимых релизных процесса.
#
# Зелёный статус здесь означает ровно перечисленное в первом абзаце, и это
# записано в README: бейдж не должен обещать больше, чем проверяет.
#
# Actions закреплены по commit SHA, как образы GitLab — по digest: `@v4` —
# движущийся тег, и без пина содержимое gate'а меняется без единой правки в
# репозитории. Точная версия оставлена комментарием, чтобы обновление было
# осознанным шагом, а не следствием чужого релиза.
#
# Фильтр тегов шире, чем у GitLab (там только `v<major>.<minor>.<patch>`):
# синтаксисы разные, и изображать их равенство нечем. Релизным тег делает
# `contract:version`, который идёт на обоих хостингах.

name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: tools/ci/run.sh contract:keywords
      - run: tools/ci/run.sh contract:version "$TAG"
        env:
          # Имя тега у хостингов называется по-разному, поэтому оно передаётся
          # аргументом: сам скрипт о хостингах не знает.
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - run: tools/ci/run.sh contract:schema
      - run: tools/ci/run.sh test:publish

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: tools/ci/run.sh test:vscode
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: vitest-junit
          path: vscode-extension/build/test-results/vitest.xml
