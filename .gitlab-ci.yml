# CI монорепозитория SmartApp DSL.
#
# Две реализации (плагин IDEA и расширение VS Code) держатся вместе двумя
# контрактами: данными (`shared/rules`, `shared/keywords`) и поведением
# (`shared/fixtures`). Стадия `contract` проверяет первый, стадия `test` — второй,
# прогоняя один и тот же корпус на обеих сторонах.
#
# Обязательность пайплайна включается в настройках проекта
# (Settings → Merge requests → «Pipelines must succeed» плюс защита ветки master),
# а не в этом файле.

stages:
  - contract
  - test
  - package

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  # Локальной IDE на runner'е нет: платформа берётся из maven-репозиториев.
  GRADLE_ARGS: "-PideSource=maven"

default:
  interruptible: true

.gradle:
  image: eclipse-temurin:21-jdk
  cache:
    key: gradle
    paths:
      - .gradle/caches
      - .gradle/wrapper

# Артефакты собираются автоматически по релизному тегу и по кнопке — на
# остальных ветках. Гонять упаковку на каждый MR незачем: тесты и контракты и
# так прогоняются, а zip с vsix нужны только когда их кто-то собирается забрать.
#
# Релизный тег — `v<version>`; что он совпадает с версией в манифестах,
# проверяет contract:version до стадии package. Тег другого вида упаковку не
# запускает вовсе — ни автоматически, ни кнопкой: пусть лучше не будет
# артефактов, чем появятся артефакты, чья версия противоречит имени тега.
# Ручная упаковка остаётся там, где тега нет и обещать он ничего не может, —
# на ветках.
.release:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG
      when: never
    - when: manual
      allow_failure: true

.node:
  image: node:22-bookworm
  cache:
    key:
      files:
        - vscode-extension/package-lock.json
    paths:
      - vscode-extension/node_modules
  before_script:
    - cd vscode-extension
    - npm ci

# --- contract ---------------------------------------------------------------

contract:rules:
  extends: .gradle
  stage: contract
  script:
    # Снимок контракта обязан совпадать с Kotlin-таблицами, из которых он растёт.
    - ./gradlew $GRADLE_ARGS :idea-plugin:exportRules --check

contract:keywords:
  image: python:3.12-slim
  stage: contract
  script:
    # Словарь обязан соответствовать vendored-исходнику фреймворка.
    - python tools/generate_keywords.py --check

contract:version:
  # Скрипту нужен только sh; образ тот же, что у contract:keywords, чтобы не
  # тянуть на runner лишний слой ради двух строк sed.
  image: python:3.12-slim
  stage: contract
  script:
    # Номер версии живёт в двух манифестах и в имени тега: разошлись — и
    # непонятно, какие zip и vsix составляют одну пару и что вообще за релиз.
    - sh tools/check-version.sh "$CI_COMMIT_TAG"

contract:schema:
  extends: .node
  stage: contract
  script:
    # Единственная schema-проверка в проекте: оба общих артефакта плюс версия.
    - npm run verify:contract

# --- test -------------------------------------------------------------------

test:idea:
  extends: .gradle
  stage: test
  script:
    - ./gradlew $GRADLE_ARGS -Djava.awt.headless=true :idea-plugin:test
  artifacts:
    when: always
    reports:
      junit: idea-plugin/build/test-results/test/TEST-*.xml
    expire_in: 1 week

test:idea:verify:
  extends: .gradle
  stage: test
  script:
    # Верификатор JetBrains ловит то, чего не видят тесты: невалидный дескриптор
    # и несовместимость с версиями платформы. Без этой job'ы регрессия в
    # plugin.xml дойдёт до master.
    - ./gradlew $GRADLE_ARGS -Djava.awt.headless=true :idea-plugin:verifyPlugin
  artifacts:
    when: on_failure
    paths:
      - idea-plugin/build/reports/pluginVerifier/
    expire_in: 1 week

test:vscode:unit:
  extends: .node
  stage: test
  script:
    # Ядро, адаптер (на фейковом vscode) и conformance-корпус.
    - npm run test:unit

test:vscode:integration:
  extends: .node
  stage: test
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      xvfb libnss3 libgbm1 libasound2 libgtk-3-0 libx11-xcb1 libxss1 libsecret-1-0
    - cd vscode-extension
    - npm ci
  script:
    # Настоящий VS Code: регистрация провайдеров и активация расширения.
    - xvfb-run -a npm run test:integration

# --- package ----------------------------------------------------------------

package:idea:
  extends:
    - .gradle
    - .release
  stage: package
  script:
    - ./gradlew $GRADLE_ARGS :idea-plugin:packagePlugin
  artifacts:
    paths:
      - dist/*.zip
    expire_in: 1 month

package:vscode:
  extends:
    - .node
    - .release
  stage: package
  script:
    # Состав .vsix проверяет сам scripts/package.mjs.
    - npm run package
  artifacts:
    paths:
      - dist/*.vsix
    expire_in: 1 month
